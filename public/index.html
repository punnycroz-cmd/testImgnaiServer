<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aether Studio | AI Manifestation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/components/button.css">
    <link rel="stylesheet" href="/css/components/card.css">
    <link rel="stylesheet" href="/css/components/glass-panel.css">
    <link rel="stylesheet" href="/css/components/nav.css">
    <link rel="stylesheet" href="/css/components/lightbox.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: {
                            950: '#08080a',
                            900: '#0f0f12',
                            800: '#1a1a1e'
                        },
                        gold: {
                            400: '#CFA972',
                            500: '#B8945F',
                            600: '#9A7B4F'
                        },
                        aether: {
                            light: '#E8DCC8',
                            dark: '#CFA972'
                        },
                        parchment: {
                            100: '#F5F2ED',
                            300: '#E8DCC8'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        cinematic: ['Outfit', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        /* Grimoire Styles */
        body { background-color: #08080a; color: #F5F2ED; overflow: hidden; }
        .panel-obsidian { background: rgba(15, 15, 18, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(207, 169, 114, 0.1); }
        .text-gold-gradient { background: linear-gradient(135deg, #E8DCC8 0%, #CFA972 50%, #B8945F 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(207, 169, 114, 0.2); border-radius: 2px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(207, 169, 114, 0.4); }

        .ornate-divider {
            height: 1px; width: 100%; background: linear-gradient(90deg, transparent 0%, rgba(207,169,114,0.3) 50%, transparent 100%);
            position: relative; margin: 20px 0;
        }
        .ornate-divider::after {
            content: '⬥'; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            color: rgba(207, 169, 114, 0.5); font-size: 10px; background: #08080a; padding: 0 10px;
        }

        .rpg-input {
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(207, 169, 114, 0.15);
            color: #E8DCC8; border-radius: 12px; transition: all 0.3s;
        }
        .rpg-input:focus { outline: none; border-color: rgba(207, 169, 114, 0.5); box-shadow: 0 0 15px rgba(207, 169, 114, 0.1); background: rgba(0, 0, 0, 0.6); }

        .btn-manifest {
            background: linear-gradient(135deg, #CFA972 0%, #B8945F 100%);
            color: #08080a; font-weight: 900; text-transform: uppercase; letter-spacing: 0.2em;
            border-radius: 14px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 20px rgba(184, 148, 95, 0.3);
        }
        .btn-manifest:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 8px 30px rgba(184, 148, 95, 0.5); }
        .btn-manifest:active { transform: translateY(0); }

        /* Navigation Pills */
        .nav-pill {
            padding: 8px 16px; border-radius: 8px; font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.3);
            transition: all 0.3s; position: relative;
        }
        .nav-pill.active { color: #CFA972; }
        .nav-pill.active::after {
            content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
            width: 4px; height: 4px; background: #CFA972; border-radius: 50%;
            box-shadow: var(--tw-shadow-glow-gold);
        }

        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeUp 0.5s var(--tw-transition-timing-function-spring) forwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Bubble Reveal (Lightbox) visibility */
        #bubbleReveal.active { opacity: 1; z-index: 1000; }
        #bubbleReveal.active > div { transform: scale(1); }
        #bubbleReveal:not(.active) > div { transform: scale(0.95); }

        /* Mobile Forge Transitions */
        @media (max-width: 767px) {
            #forgeSidebar { 
                bottom: 64px;
                border-radius: 24px 24px 0 0;
                background: rgba(8, 8, 10, 0.98);
                backdrop-filter: blur(40px);
                height: 85vh;
            }
            #forgeSidebar.minimized { height: 60px; }
            
            /* Unified Header Handle */
            .BrandHeader { cursor: pointer; height: 60px; display: flex; align-items: center; }
            #forgeSidebar.minimized .BrandHeader { background: rgba(207, 169, 114, 0.1); border-bottom: 1px solid rgba(207,169,114,0.1); }
            
            /* Hidden ONLY when minimized */
            #forgeSidebar.minimized #forgeControls, 
            #forgeSidebar.minimized .ornate-divider,
            #forgeSidebar.minimized .BottomAction { 
                opacity: 0; pointer-events: none; visibility: hidden;
            }
            #forgeSidebar.minimized p.uppercase { display: none; } /* Hide subtitle when closed */

            /* Visible when expanded */
            #forgeSidebar:not(.minimized) #forgeControls,
            #forgeSidebar:not(.minimized) .BrandHeader,
            #forgeSidebar:not(.minimized) .BottomAction {
                opacity: 1; visibility: visible; pointer-events: auto;
            }
            
            #forgeSidebar:not(.minimized) + #consoleBackdrop { opacity: 1; pointer-events: auto; }
            
            .mobile-nav-item.active { color: #CFA972; }
            .mobile-nav-item.active svg { filter: drop-shadow(0 0 8px rgba(207,169,114,0.5)); }
        }

        /* --- EFFECTS & ANIMATIONS --- */
        .animate-float { animation: float 8s ease-in-out infinite; }
        .animate-float-delayed { animation: float 9s ease-in-out infinite 2s; }
        @keyframes float { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-20px) rotate(3deg); } 100% { transform: translateY(0px) rotate(0deg); } }

        .loader-rune {
            width: 24px; height: 24px; display: none; position: relative; z-index: 3;
        }
        .loader-rune::before, .loader-rune::after {
            content: ''; position: absolute; inset: 0; border: 2.5px solid transparent; border-radius: 50%;
        }
        .loader-rune::before { border-top-color: #08080a; animation: spin 0.8s linear infinite; }
        .loader-rune::after { border-bottom-color: rgba(0,0,0,0.2); animation: spin 1.2s linear reverse infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .btn-manifest.is-loading .btn-text { display: none; }
        .btn-manifest.is-loading .loader-rune { display: block; }

        /* Aspect Radio Logic */
        .aspect-radio input[type="radio"] { display: none; }
        .aspect-radio label {
            display: flex; flex-direction: column; items: center; gap: 8px; padding: 12px 4px;
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(207, 169, 114, 0.1);
            border-radius: 12px; color: rgba(207, 169, 114, 0.4); font-size: 9px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.1em; transition: all 0.3s; cursor: pointer;
        }
        .aspect-radio label:hover { background: rgba(255, 255, 255, 0.05); }
        .aspect-radio input[type="radio"]:checked + label {
            background: rgba(207, 169, 114, 0.1); border-color: rgba(207, 169, 114, 0.6);
            color: #CFA972; box-shadow: 0 0 15px rgba(207, 169, 114, 0.1);
        }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen overflow-hidden">
    
    <!-- 1. AMBIENT BACKGROUND -->
    <div class="fixed inset-0 z-0 bg-obsidian-950">
        <canvas id="aetherCanvas" class="opacity-40 w-full h-full"></canvas>
        <div class="absolute inset-0 bg-gradient-to-tr from-obsidian-950 via-transparent to-gold-400/5"></div>
        <div class="absolute top-[-10%] right-[-10%] w-[600px] h-[600px] bg-gold-400/5 blur-[120px] rounded-full animate-pulse"></div>
    </div>

    <!-- 2. LOGIN / AUTH OVERLAY -->
    <div id="auth-overlay" class="fixed inset-0 z-[200] flex items-center justify-center p-6 bg-obsidian-950/95 backdrop-blur-2xl transition-all duration-700">
        <div class="w-full max-w-md panel-obsidian p-10 rounded-[2rem] text-center shadow-rpg-panel relative overflow-hidden group">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-gold-400 to-transparent"></div>
            <div class="w-20 h-20 border-2 border-gold-400 bg-obsidian-950 flex items-center justify-center transform rotate-45 mx-auto mb-10 shadow-glow-gold transition-transform group-hover:rotate-[135deg] duration-700">
                <div class="w-8 h-8 bg-gradient-to-br from-gold-400 to-gold-600 rounded-sm transform -rotate-45"></div>
            </div>
            <h2 class="text-4xl font-black text-cinematic text-gold-gradient mb-4">Aether Studio</h2>
            <p class="text-white/40 text-xs uppercase tracking-[0.4em] font-bold mb-10">Divine Manifestation Engine</p>
            
            <button id="google-login-btn" class="w-full h-14 bg-white text-black font-black uppercase text-xs tracking-widest rounded-xl flex items-center justify-center gap-4 hover:bg-gold-400 transition-all active:scale-95 shadow-xl">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Summon with Google
            </button>
            <p id="auth-status" class="mt-6 text-[10px] text-white/20 font-bold uppercase tracking-widest"></p>
        </div>
    </div>

    <!-- 3. THE FORGE (Aside) -->
    <aside id="forgeSidebar" class="panel-obsidian w-full md:w-[400px] lg:w-[440px] xl:w-[480px] fixed md:relative bottom-0 left-0 h-[85vh] md:h-screen flex flex-col z-[100] md:z-30 border-t md:border-t-0 md:border-r border-gold-400/20 flex-shrink-0 transition-all duration-500 ease-in-out group/forge shadow-[0_-20px_50px_rgba(0,0,0,0.8)] md:shadow-none">
        
        <!-- Brand Header (Acts as Mobile Handle) -->
        <div class="BrandHeader p-4 md:p-8 pb-4 flex items-center gap-4 relative z-10 transition-all duration-300">
            <div class="w-8 h-8 md:w-12 md:h-12 border border-gold-400/80 bg-obsidian-950 flex items-center justify-center shadow-glow-gold transform rotate-45 shrink-0">
                <div class="w-2.5 h-2.5 md:w-4 md:h-4 bg-gradient-to-br from-aether-light to-aether-dark rounded-sm transform -rotate-45 shadow-glow-aether"></div>
            </div>
            <div class="flex-1">
                <div class="flex items-center justify-between">
                    <h1 class="text-xl md:text-3xl font-black text-cinematic text-gold-gradient leading-none">The Forge</h1>
                    <!-- Mobile Toggle Icon -->
                    <svg class="md:hidden w-5 h-5 text-gold-400 transition-transform duration-500 group-[.minimized]/forge:rotate-180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m6 9 6 6 6-6"/></svg>
                </div>
                <p class="text-[9px] md:text-[10px] uppercase tracking-[0.3em] text-white/40 font-semibold mt-1">Aether Studio v4</p>
            </div>
        </div>

        <!-- Navigation Tabs (Hidden on mobile) -->
        <div class="px-4 md:px-8 mb-4 hidden md:block">
            <div class="glass-light p-1.5 rounded-xl flex items-center justify-between pointer-events-auto border border-white/40 overflow-hidden shadow-sm">
                <!-- Data-view attributes bind to our Router.js -->
                <button data-view="history" class="nav-pill active flex-1 text-center">Vault</button>
                <button data-view="discovery" class="nav-pill flex-1 text-center">Discovery</button>
                <button data-view="feed" class="nav-pill flex-1 text-center">Feed</button>
            </div>
        </div>

        <!-- Forge Scrollable Controls -->
        <div id="forgeControls" class="flex-1 overflow-y-auto px-8 space-y-7 pb-32 md:pb-8 relative z-10 custom-scrollbar">
            <div class="ornate-divider"></div>

            <!-- Incantation (Prompt) -->
            <div class="space-y-3">
                <div class="flex justify-between items-end">
                    <label class="text-[11px] font-bold uppercase text-gold-400/90 tracking-[0.2em] flex items-center gap-2">
                        <span class="w-1.5 h-1.5 bg-aether rounded-full shadow-glow-aether animate-pulse"></span>
                        The Incantation
                    </label>
                </div>
                <textarea id="prompt" rows="4" placeholder="Describe the masterpiece you wish to manifest..." class="rpg-input w-full p-4 text-[15px] font-medium leading-relaxed resize-none"></textarea>
            </div>

            <!-- Wards (Negative Prompt) -->
            <div class="space-y-3">
                <label class="text-[10px] font-bold uppercase text-gold-400/50 tracking-[0.2em] flex items-center gap-2">
                    <span class="w-1.5 h-1.5 bg-red-900/80 rounded-full border border-red-500/50"></span>
                    Wards (Exclusions)
                </label>
                <textarea id="negativePrompt" rows="2" placeholder="Elements to banish (e.g. low quality, bad anatomy)..." class="rpg-input w-full p-4 text-sm leading-relaxed resize-none opacity-80 focus:opacity-100"></textarea>
            </div>

            <div class="ornate-divider"></div>

            <!-- Dimensional Realm -->
            <div class="space-y-3">
                <label class="text-[10px] font-bold uppercase text-gold-400/80 tracking-[0.2em]">Dimensional Realm</label>
                <div class="flex p-1 bg-black/40 border border-gold-400/20 rounded-xl">
                    <button data-action="switchMode" data-mode="standard" class="flex-1 py-3 text-[10px] font-bold uppercase tracking-[0.2em] rounded-lg transition-all text-gold-400/50 hover:text-gold-400 active">Day Realm</button>
                    <button data-action="switchMode" data-mode="nsfw" class="flex-1 py-3 text-[10px] font-bold uppercase tracking-[0.2em] rounded-lg transition-all text-gold-400/50 hover:text-gold-400">Star Realm</button>
                </div>
            </div>

            <!-- Casting Engine -->
            <div class="space-y-3">
                <label class="text-[10px] font-bold uppercase text-gold-400/80 tracking-[0.2em]">Casting Engine</label>
                <div class="relative">
                    <select id="model" class="rpg-input w-full h-12 px-4 appearance-none text-sm font-semibold cursor-pointer">
                        <option value="Aether Synthesis v4.2">Aether Synthesis v4.2</option>
                        <option value="Ghibli Cinematic v2">Ghibli Cinematic v2</option>
                        <option value="Epic Concept Art">Epic Concept Art</option>
                        <option value="Retro Pixel Forge">Retro Pixel Forge</option>
                    </select>
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-gold-400">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
                    </div>
                </div>
            </div>

            <!-- Advanced Controls for our FE -->
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-3">
                    <label class="text-[10px] font-bold uppercase text-gold-400/80 tracking-[0.2em]">Images</label>
                    <div class="relative">
                        <select id="count" class="rpg-input w-full h-12 px-4 appearance-none text-sm font-semibold cursor-pointer">
                            <option value="1">1 Manifestation</option>
                            <option value="2">2 Manifestations</option>
                            <option value="4" selected>4 Manifestations</option>
                        </select>
                        <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-gold-400"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></div>
                    </div>
                </div>
                <div class="space-y-3">
                    <label class="text-[10px] font-bold uppercase text-gold-400/80 tracking-[0.2em]">Quality</label>
                    <div class="relative">
                        <select id="quality" class="rpg-input w-full h-12 px-4 appearance-none text-sm font-semibold cursor-pointer">
                            <option value="standard">Standard</option>
                            <option value="hd" selected>High-Res</option>
                        </select>
                        <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-gold-400"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></div>
                    </div>
                </div>
            </div>

            <!-- Aspect Ratio -->
            <div class="space-y-3">
                <label class="text-[10px] font-bold uppercase text-gold-400/80 tracking-[0.2em]">Canvas Dimensions</label>
                <div class="grid grid-cols-5 gap-1">
                    <div class="aspect-radio">
                        <input type="radio" name="aspectRatio" id="ar-1-1" value="1:1" data-dim="1024x1024" checked>
                        <label for="ar-1-1"><div class="w-3.5 h-3.5 border-2 border-current rounded-sm"></div>1:1</label>
                    </div>
                    <div class="aspect-radio">
                        <input type="radio" name="aspectRatio" id="ar-4-3" value="4:3" data-dim="1024x768">
                        <label for="ar-4-3"><div class="w-4 h-3 border-2 border-current rounded-sm"></div>4:3</label>
                    </div>
                    <div class="aspect-radio">
                        <input type="radio" name="aspectRatio" id="ar-16-9" value="16:9" data-dim="1920x1080">
                        <label for="ar-16-9"><div class="w-5 h-3 border-2 border-current rounded-sm"></div>16:9</label>
                    </div>
                    <div class="aspect-radio">
                        <input type="radio" name="aspectRatio" id="ar-9-16" value="9:16" data-dim="1080x1920">
                        <label for="ar-9-16"><div class="w-3 h-5 border-2 border-current rounded-sm"></div>9:16</label>
                    </div>
                    <div class="aspect-radio">
                        <input type="radio" name="aspectRatio" id="ar-21-9" value="21:9" data-dim="2560x1080">
                        <label for="ar-21-9"><div class="w-6 h-2.5 border-2 border-current rounded-sm"></div>21:9</label>
                    </div>
                </div>
            </div>

            <!-- Seed (Optional) -->
            <div class="space-y-3">
                <label class="text-[10px] font-bold uppercase text-gold-400/50 tracking-[0.2em] flex items-center gap-2">
                    Magic Seed (Optional)
                </label>
                <input id="seed" type="number" placeholder="Leave empty for random..." class="rpg-input w-full p-3 text-sm" />
            </div>

            <!-- Local Gallery (for current forge generation) -->
            <div id="gallery" class="grid grid-cols-2 gap-4 mt-8"></div>
            <div id="matrixGallery" class="grid-cols-2 gap-4 mt-8 hidden"></div>
        </div>

        <!-- Bottom Action -->
        <div class="BottomAction p-6 md:p-8 bg-obsidian-950/90 backdrop-blur-xl border-t border-gold-400/20 absolute md:relative bottom-0 w-full z-30 shadow-[0_-10px_30px_rgba(0,0,0,0.5)] transition-opacity duration-300">
            <button id="generateBtn" data-action="runGeneration" class="btn-manifest w-full h-14 flex items-center justify-center gap-3">
                <span id="btnText" class="btn-text flex items-center gap-2">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48 2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48 2.83-2.83"/></svg>
                    Manifest Vision
                </span>
                <div id="btnLoader" class="loader-rune"></div>
            </button>
            <button id="matrixBtn" data-action="runMatrixCast" class="mt-4 w-full py-3 bg-black/40 hover:bg-gold-400/10 border border-gold-400/20 text-gold-400/70 hover:text-gold-400 text-[10px] font-bold uppercase tracking-[0.2em] transition-all rounded-xl flex items-center justify-center gap-2">
                <span id="btnMatrixText">Matrix Cast (All Models)</span>
                <div id="btnMatrixLoader" class="loader-rune !w-4 !h-4 hidden"></div>
            </button>
            <div id="matrixControls" class="hidden flex justify-between mt-3 px-2">
                <span id="matrixStatusText" class="text-[10px] font-bold text-gold-400 uppercase tracking-widest animate-pulse">Initializing...</span>
            </div>
        </div>
    </aside>

    <!-- CONSOLE BACKDROP (For Mobile focus) -->
    <div id="consoleBackdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[90] opacity-0 pointer-events-none transition-opacity duration-500"></div>

    <!-- 4. BOTTOM NAVIGATION (Mobile) -->
    <nav class="md:hidden fixed bottom-0 left-0 w-full h-16 bg-obsidian-950/95 backdrop-blur-xl border-t border-gold-400/20 z-[110] flex items-center justify-around px-4">
        <button data-action="setView" data-view="history" class="mobile-nav-item active flex flex-col items-center gap-1 text-white/40">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span class="text-[9px] font-bold uppercase tracking-widest">Vault</span>
        </button>
        <button data-action="setView" data-view="discovery" class="mobile-nav-item flex flex-col items-center gap-1 text-white/40">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <span class="text-[9px] font-bold uppercase tracking-widest">Global</span>
        </button>
        <button data-action="setView" data-view="feed" class="mobile-nav-item flex flex-col items-center gap-1 text-white/40">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span class="text-[9px] font-bold uppercase tracking-widest">Feed</span>
        </button>
    </nav>

    <!-- 5. MAIN CONTENT AREA -->
    <main class="flex-1 h-screen flex flex-col relative z-20">
        <!-- Top Toolbar -->
        <header class="p-4 md:p-10 flex justify-between items-start z-30 sticky top-0 bg-gradient-to-b from-obsidian-950 via-obsidian-950/80 to-transparent pointer-events-none">
            <div class="pointer-events-auto">
                <h2 id="viewTitle" class="text-3xl md:text-5xl font-black text-cinematic text-parchment-100 tracking-tight leading-none drop-shadow-2xl">
                    Your <span class="italic text-gold-500">Grimoire</span>
                </h2>
                <p id="viewSubtitle" class="text-parchment-100/40 font-bold uppercase tracking-[0.2em] text-[9px] md:text-[10px] mt-2 ml-1">Aether Studio Private Vault</p>
                <div class="status-pill text-[10px] mt-2 text-parchment-100/60" id="backendStatus">Checking backend...</div>
            </div>
            
            <div class="pointer-events-auto flex items-center gap-4">
                <button id="show-hidden-btn" data-action="toggleHiddenVault" class="px-4 py-2 bg-white/5 border border-white/10 rounded-lg text-[10px] font-bold uppercase tracking-widest hover:bg-white/10 transition-all">Show Hidden</button>
                <button id="toggleSelectBtn" data-action="toggleSelectionMode" class="px-4 py-2 bg-white/5 border border-white/10 rounded-lg text-[10px] font-bold uppercase tracking-widest hover:bg-white/10 transition-all">Select Mode</button>
                <div id="user-profile" class="hidden flex items-center gap-3">
                    <button data-action="logout" class="text-[10px] uppercase font-bold tracking-wider hover:text-red-600 transition-colors">Logout</button>
                    <div class="h-12 w-12 rounded-xl border-2 border-gold-400 overflow-hidden cursor-pointer shadow-glow-gold bg-parchment-300 transform transition-transform hover:-translate-y-1">
                        <img id="user-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=AetherMage&backgroundColor=E8DCC8" alt="Profile" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>
        </header>

        <!-- View Containers -->
        <div class="flex-1 overflow-y-auto px-6 md:px-10 pb-24 pt-4 custom-scrollbar" id="mainScrollArea">
            
            <!-- VIEW: VAULT -->
            <section id="view-history" class="view view-section active min-h-full pb-12">
                <div id="historyList" class="columns-1 sm:columns-2 lg:columns-3 xl:columns-4 2xl:columns-5 gap-4 md:gap-6 space-y-4 md:space-y-6 w-full"></div>
                <div id="loadMoreBtn" class="h-12 w-full flex items-center justify-center mt-8 opacity-0"></div>
            </section>

            <!-- VIEW: DISCOVERY -->
            <section id="view-discovery" class="view view-section min-h-full pb-12">
                <div id="discoveryList" class="columns-1 sm:columns-2 lg:columns-3 xl:columns-4 2xl:columns-5 gap-4 md:gap-6 space-y-4 md:space-y-6 w-full"></div>
                <div id="loadMoreDiscoveryBtn" class="h-12 w-full flex items-center justify-center mt-8 opacity-0"></div>
            </section>

            <!-- VIEW: FEED -->
            <section id="view-feed" class="view view-section flex flex-col items-center min-h-full pb-12 w-full">
                <div class="w-full max-w-2xl bg-black/40 border border-gold-400/20 p-4 md:p-6 rounded-2xl mb-8 mx-auto">
                    <textarea id="feed-post-content" placeholder="Share your magical discoveries..." class="rpg-input w-full h-24 p-4 text-sm mb-4 resize-none"></textarea>
                    <div class="flex justify-end">
                        <button data-action="createPost" class="px-6 py-2 bg-gold-400 text-black font-bold uppercase text-[10px] tracking-widest rounded-lg hover:shadow-glow-gold transition-all">Broadcast</button>
                    </div>
                </div>
                <div id="feedList" class="w-full max-w-2xl flex flex-col gap-8 pb-12"></div>
                <div id="loadMoreFeedBtn" class="h-12 w-full flex items-center justify-center mt-4 opacity-0"></div>
            </section>
        </div>

        <!-- SELECTION BAR FOR BULK ACTIONS -->
        <div id="selectionBar" class="hidden fixed bottom-6 left-1/2 transform -translate-x-1/2 z-40 flex items-center justify-between gap-6 px-6 py-4 bg-obsidian-950/95 border-2 border-gold-400/40 rounded-2xl shadow-2xl backdrop-blur-xl w-[90%] max-w-xl transition-all duration-300">
            <div class="flex items-center gap-3">
                <span class="w-2.5 h-2.5 rounded-full bg-gold-400 animate-pulse"></span>
                <span class="text-xs uppercase font-black tracking-widest text-white/90">
                    <span id="selectCount" class="text-gold-400 font-black">0</span> Selected
                </span>
            </div>
            <div class="flex items-center gap-3">
                <button data-action="bulkHide" class="px-4 py-2 border border-white/10 hover:border-[var(--accent)] hover:bg-[var(--accent)]/10 text-[10px] text-white/80 font-bold uppercase tracking-widest rounded-lg transition-all">
                    Hide
                </button>
                <button data-action="bulkDelete" class="px-4 py-2 border border-red-500/20 hover:border-red-500 hover:bg-red-500/10 text-[10px] text-red-400 font-bold uppercase tracking-widest rounded-lg transition-all">
                    Banish
                </button>
                <button data-action="cancelSelectionMode" class="px-4 py-2 border border-white/5 hover:bg-white/5 text-[10px] text-white/40 font-bold uppercase tracking-widest rounded-lg transition-all">
                    Cancel
                </button>
            </div>
        </div>
    </main>

    <!-- LIGHTBOX MODAL -->
    <div id="bubbleReveal" class="fixed inset-0 z-[100] bg-obsidian-950/90 backdrop-blur-xl hidden opacity-0 transition-opacity duration-400 flex items-center justify-center p-4 md:p-8" data-action="closeLightbox">
        <button data-action="closeLightbox" class="absolute top-6 right-6 text-white/50 hover:text-gold-400 bg-white/5 w-12 h-12 rounded-full flex items-center justify-center transition-all z-[150] border border-white/10 hover:border-gold-400/50 hover:scale-110">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div class="flex flex-col md:flex-row w-full max-w-[1400px] h-full max-h-[90vh] panel-obsidian rounded-2xl overflow-hidden shadow-rpg-panel transform transition-transform duration-500 scale-100" data-stop-propagation="true">
            <div class="flex-1 bg-black/80 relative flex items-center justify-center p-6 min-h-[40vh] border-r border-gold-400/10">
                <img id="bubbleRevealImg" src="" alt="Enlarged Vision" class="max-w-full max-h-full object-contain shadow-2xl rounded">
            </div>
            <div class="w-full md:w-[420px] p-8 lg:p-10 flex flex-col gap-6 overflow-y-auto custom-scrollbar">
                <div class="border-b border-gold-400/10 pb-4">
                    <h4 class="text-[10px] font-bold uppercase text-gold-400 tracking-[0.3em] mb-3 flex items-center gap-2">The Incantation</h4>
                    <p id="lightboxPrompt" class="text-base text-white/90 leading-relaxed font-serif italic tracking-wide"></p>
                </div>
                <div class="border-b border-gold-400/10 pb-4">
                    <h4 class="text-[10px] font-bold uppercase text-red-500/80 tracking-[0.3em] mb-3">The Wards</h4>
                    <p id="lightboxNegative" class="text-xs text-white/40 leading-relaxed"></p>
                </div>
                
                <!-- METADATA SUBSECTION -->
                <div class="border-b border-gold-400/10 pb-4 flex justify-between items-center text-xs">
                    <div>
                        <span class="text-[9px] font-bold uppercase text-gold-400/60 tracking-[0.2em] block mb-0.5">Index</span>
                        <span id="bubbleMeta" class="text-white/80 font-bold">#1</span>
                    </div>
                    <div>
                        <span class="text-[9px] font-bold uppercase text-gold-400/60 tracking-[0.2em] block mb-0.5">Dimensions</span>
                        <span id="lightboxDims" class="text-white/80 font-bold">1024x1024</span>
                    </div>
                </div>

                <div id="thumbsSection" class="hidden flex flex-col gap-3">
                    <h4 class="text-[10px] font-black text-gold-400 uppercase tracking-widest">The Batch</h4>
                    <div id="bubbleRevealThumbs" class="grid grid-cols-4 gap-2"></div>
                </div>

                <!-- ACTIONS LIST -->
                <div class="space-y-3 pt-2">
                    <h4 class="text-[9px] font-bold uppercase text-gold-400/60 tracking-[0.2em] mb-2">Actions</h4>
                    
                    <a id="bubbleRevealDownload" href="" download class="w-full py-2.5 border border-gold-400/20 hover:border-gold-400 hover:bg-gold-400/10 rounded-lg text-[10px] font-bold uppercase tracking-widest text-center text-gold-400 flex items-center justify-center gap-2 transition-all">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Download Vision
                    </a>

                    <button data-action="cloneManifestation" class="w-full py-2.5 bg-white/5 border border-white/10 hover:border-gold-400 hover:text-gold-400 rounded-lg text-[10px] font-bold uppercase tracking-widest flex items-center justify-center gap-2 transition-all text-white/70">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                        Clone to Forge
                    </button>

                    <button id="publishBtn" data-action="togglePublishCurrentBatch" class="w-full py-2.5 border border-white/10 rounded-lg text-[10px] font-bold uppercase tracking-widest hover:bg-white/5 transition-all text-white/60">
                        Post to Public
                    </button>

                    <button data-action="shareCurrentImage" class="w-full py-2.5 border border-white/10 rounded-lg text-[10px] font-bold uppercase tracking-widest hover:bg-white/5 transition-all text-white/60 flex items-center justify-center gap-2">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
                        Share Vision
                    </button>
                </div>

                <div class="mt-auto space-y-3 pt-4 border-t border-gold-400/10">
                    <button data-action="hideCurrentItem" class="w-full py-2.5 border border-white/10 rounded-lg text-[10px] font-bold uppercase tracking-widest hover:bg-white/5 transition-all text-white/50">Hide Manifestation</button>
                    <button data-action="banishCurrentItem" class="w-full py-2.5 border border-red-500/20 rounded-lg text-[10px] font-bold uppercase tracking-widest hover:bg-red-500/10 transition-all text-red-500/50">Banish Spirit</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
