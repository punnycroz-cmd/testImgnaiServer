<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aether Studio | AI Manifestation Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Outfit:wght@300;400;600;800&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --tw-transition-timing-function-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --tw-shadow-glow-gold: 0 0 15px rgba(207, 169, 114, 0.3);
            --tw-shadow-glow-aether: 0 0 20px rgba(114, 169, 207, 0.4);
            --aether-light: #72A9CF;
            --aether-dark: #3A6D8C;
            --gold-400: #CFA972;
            --gold-500: #B8860B;
            --obsidian-950: #08080a;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--obsidian-950);
            color: #fdfbf7;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .text-cinematic { font-family: 'Cinzel Decorative', cursive; }
        .panel-obsidian { background: rgba(8, 8, 10, 0.7); backdrop-filter: blur(20px); }
        .text-gold-gradient {
            background: linear-gradient(135deg, #FDE08B 0%, #CFA972 50%, #A6824C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* RPG UI Styling */
        .rpg-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(207, 169, 114, 0.2);
            color: #fdfbf7;
            border-radius: 12px;
            transition: all 0.3s var(--tw-transition-timing-function-spring);
        }
        .rpg-input:focus {
            outline: none; 
            border: none;
            background: rgba(207, 169, 114, 0.05);
            box-shadow: inset 0 0 0 1px #CFA972, inset 0 0 15px rgba(207, 169, 114, 0.1);
        }
        .rpg-input::placeholder { color: rgba(253, 251, 247, 0.3); font-weight: 300; }

        /* Custom Aspect Radio Buttons */
        .aspect-radio input[type="radio"] { display: none; }
        .aspect-radio label {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255,255,255,0.4); cursor: pointer;
            transition: all 0.3s var(--tw-transition-timing-function-spring);
            height: 48px; font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
            clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
        }
        .aspect-radio label:hover { background: rgba(255, 255, 255, 0.05); }
        .aspect-radio input[type="radio"]:checked + label {
            background: rgba(207, 169, 114, 0.15); border-color: #CFA972; color: #CFA972;
            box-shadow: inset 0 0 10px rgba(207, 169, 114, 0.1);
        }

        /* Manifest Magic Button */
        .btn-manifest {
            position: relative; overflow: hidden;
            background: linear-gradient(135deg, #FDE08B 0%, #CFA972 50%, #A6824C 100%);
            color: #08080a; font-weight: 800; text-transform: uppercase; letter-spacing: 0.15em;
            clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
            transition: all 0.4s var(--tw-transition-timing-function-spring);
        }
        .btn-manifest::before {
            content: ''; position: absolute; inset: 1px;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.4), transparent);
            clip-path: polygon(13px 0, 100% 0, calc(100% - 13px) 100%, 0 100%);
            z-index: 1; pointer-events: none;
        }
        .btn-manifest::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            transform: skewX(-25deg); transition: all 0.7s;
        }
        .btn-manifest:hover::after { left: 150%; }
        .btn-manifest:active { transform: scale(0.98); filter: brightness(1.2); }

        /* Rune Loader */
        .loader-rune {
            width: 24px; height: 24px; border: 3px solid rgba(0,0,0,0.1);
            border-top: 3px solid #08080a; border-radius: 50%;
            animation: spin 1s linear infinite; display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Navigation Pills */
        .nav-pill {
            padding: 8px 16px; border-radius: 8px; font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.3);
            transition: all 0.3s; position: relative;
        }
        .nav-pill.active { color: #CFA972; }
        .nav-pill.active::after {
            content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
            width: 4px; height: 4px; background: #CFA972; border-radius: 50%;
            box-shadow: var(--tw-shadow-glow-gold);
        }

        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeUp 0.5s var(--tw-transition-timing-function-spring) forwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Bubble Reveal (Lightbox) visibility */
        #bubbleReveal.active { opacity: 1; z-index: 1000; }
        #bubbleReveal.active > div { transform: scale(1); }
        #bubbleReveal:not(.active) > div { transform: scale(0.95); }

        /* Mobile Forge Transitions */
        @media (max-width: 767px) {
            #forgeSidebar { 
                bottom: 64px;
                border-radius: 24px 24px 0 0;
                background: rgba(8, 8, 10, 0.98);
                backdrop-filter: blur(40px);
                height: 85vh;
            }
            #forgeSidebar.minimized { height: 48px; }
            #forgeSidebar.minimized #mobileForgeToggle { 
                top: 0; left: 0; right: 0; width: 100%; height: 48px;
                transform: none; border-radius: 24px 24px 0 0; 
                background: rgba(207, 169, 114, 0.1);
                border: none;
            }
            #forgeSidebar.minimized #mobileForgeToggle span { transform: rotate(180deg); }
            
            /* Hidden ONLY when minimized */
            #forgeSidebar.minimized #forgeControls, 
            #forgeSidebar.minimized .ornate-divider,
            #forgeSidebar.minimized .BrandHeader,
            #forgeSidebar.minimized .BottomAction { 
                opacity: 0; pointer-events: none; visibility: hidden;
            }
            #forgeSidebar.minimized p.uppercase { display: none; }

            /* Backdrop Logic */
            #forgeSidebar:not(.minimized) ~ #consoleBackdrop { 
                opacity: 1; pointer-events: auto; backdrop-filter: blur(12px);
            }

            /* Visible when expanded */
            #forgeSidebar:not(.minimized) #forgeControls,
            #forgeSidebar:not(.minimized) .BrandHeader,
            #forgeSidebar:not(.minimized) .BottomAction {
                opacity: 1; visibility: visible; pointer-events: auto;
            }
            
            .mobile-nav-item.active { color: #CFA972; }
            .mobile-nav-item.active svg { filter: drop-shadow(0 0 8px rgba(207,169,114,0.5)); }
        }

        /* --- EFFECTS & ANIMATIONS --- */
        .animate-float { animation: float 8s ease-in-out infinite; }
        .animate-float-delayed { animation: float 9s ease-in-out infinite 2s; }
        @keyframes float { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-20px) rotate(3deg); } 100% { transform: translateY(0px) rotate(0deg); } }

        .glass-light { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); }
        .shadow-rpg-panel { box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.05); }
        .shadow-glow-gold { filter: drop-shadow(0 0 12px rgba(207, 169, 114, 0.4)); }
        .shadow-glow-aether { filter: drop-shadow(0 0 15px rgba(114, 169, 207, 0.5)); }
        
        .ornate-divider::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(207, 169, 114, 0.4), transparent);
        }
        .ornate-divider::after {
            content: '♦'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #CFA972; font-size: 10px; text-shadow: var(--tw-shadow-glow-gold);
        }

        button[data-mode].active {
            background: rgba(207, 169, 114, 0.15);
            color: #CFA972;
            box-shadow: inset 0 0 10px rgba(207, 169, 114, 0.1);
        }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen w-full relative">

  <div class="fixed top-1/3 -right-32 opacity-30 animate-float-delayed pointer-events-none z-[-2] scale-150">
      <svg width="400" height="400" viewBox="0 0 200 200" fill="none"><path d="M45.7 75.8C35.2 65.3 45.1 42.1 63.4 42.1C68.6 42.1 72.8 44.5 76.5 47.9C83.2 27.8 103.5 15.6 122.9 15.6C145.4 15.6 161.4 34.6 161.4 57.1C161.4 58.2 161.3 59.3 161.2 60.4C172.9 64.2 181.4 75.3 181.4 88.6C181.4 103.8 168.9 116.1 153.6 116.1H40.7C19.7 116.1 2.7 99.1 2.7 78.1C2.7 61.4 14.3 47.3 30.2 43.6C34.2 53.6 39.5 64.6 45.7 75.8Z" fill="#E8DCC8" filter="blur(20px)"/></svg>
  </div>  <!-- 3. THE FORGE (Aside) -->

        <!-- Brand Header (Integrated Handle) -->
        <div class="BrandHeader p-5 md:p-8 flex items-center gap-4 relative z-10 cursor-pointer hover:bg-white/5 transition-all">
            <div class="w-10 h-10 border border-gold-400/80 bg-obsidian-950 flex items-center justify-center transform rotate-45 shrink-0">
                <div class="w-3 h-3 bg-gradient-to-br from-aether-light to-aether-dark rounded-sm transform -rotate-45 shadow-glow-aether"></div>
            </div>
            <div class="flex-1">
                <div class="flex items-center justify-between">

            </div>

      <div class="flex flex-col md:flex-row w-full max-w-[1400px] h-full max-h-[90vh] panel-obsidian rounded-2xl overflow-hidden shadow-rpg-panel transform transition-transform duration-500 scale-100" data-stop-propagation="true">

          </div>
          <div class="w-full md:w-[420px] p-8 lg:p-10 flex flex-col gap-8 overflow-y-auto custom-scrollbar glass-reveal-panel">
              <div class="space-y-2"><label class="text-[10px] font-black uppercase tracking-[0.3em] text-gold-400/60">Incantation</label><p id="revealPrompt" class="text-parchment-100 text-lg leading-relaxed font-medium italic"></p></div>
              <div class="BottomAction-Reveal mt-auto flex flex-col gap-3"><button data-action="cloneActiveManifestation" class="btn-manifest w-full h-14 flex items-center justify-center gap-3">Clone Vision</button></div>
          </div>
      </div>
  </div>

  <div id="consoleBackdrop" class="fixed inset-0 bg-black/40 z-[90] opacity-0 pointer-events-none transition-all duration-500"></div>

  <script type="module" src="js/main.js"></script>
  <script>
        const canvas = document.getElementById('particlesCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.4 - 0.2; this.speedY = Math.random() * -0.6 - 0.1; 
                this.color = Math.random() > 0.5 ? 'rgba(212, 175, 55, ' : 'rgba(255, 255, 255, ';
                this.opacity = Math.random() * 0.6 + 0.2;
            }
            update() { this.x += this.speedX; this.y += this.speedY; if (this.y < 0) this.y = canvas.height; }
            draw() { ctx.fillStyle = this.color + this.opacity + ')'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
        }
        for (let i = 0; i < 50; i++) particles.push(new Particle());
        function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
        animate();
  </script>
</body>
</html>
